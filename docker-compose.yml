services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      NUTEE_DATA_DIR: /app/data
      APP_ENV: ${APP_ENV:-dev}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "2"
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      POSTHOG_TEST_PROJECT: ${POSTHOG_TEST_PROJECT:-false}
      POSTHOG_PROJECT_KEY: ${POSTHOG_PROJECT_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://us.i.posthog.com}
      POSTHOG_API_HOST: ${POSTHOG_API_HOST:-https://us.posthog.com}
      POSTHOG_PROJECT_ID: ${POSTHOG_PROJECT_ID:-}
      POSTHOG_PERSONAL_API_KEY: ${POSTHOG_PERSONAL_API_KEY:-}
      POSTHOG_REAL_API_HOST: ${POSTHOG_REAL_API_HOST:-https://us.posthog.com}
      POSTHOG_REAL_PROJECT_ID: ${POSTHOG_REAL_PROJECT_ID:-}
      POSTHOG_REAL_PERSONAL_API_KEY: ${POSTHOG_REAL_PERSONAL_API_KEY:-}
    volumes:
      - nutee-product-demo-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_POSTHOG_KEY: ${VITE_POSTHOG_KEY:-}
        VITE_POSTHOG_HOST: ${VITE_POSTHOG_HOST:-https://us.i.posthog.com}
        VITE_POSTHOG_TEST_PROJECT: ${VITE_POSTHOG_TEST_PROJECT:-false}
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
  demo-data:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "scripts.demo", "--events", "100000", "--seed", "42"]
    environment:
      NUTEE_DATA_DIR: /app/data
      APP_ENV: dev
      POSTHOG_TEST_PROJECT: "false"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "2"
    volumes:
      - nutee-product-demo-data:/app/data
    depends_on:
      backend:
        condition: service_healthy
    restart: "no"
  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "pytest", "-q", "-p", "no:cacheprovider"]
    network_mode: none
    environment:
      NUTEE_DATA_DIR: /tmp/nutee-tests
      APP_ENV: dev
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "2"
    volumes:
      - ./tests:/app/tests:ro
      - ./pytest.ini:/app/pytest.ini:ro
volumes:
  nutee-product-demo-data:
